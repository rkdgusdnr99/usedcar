# CI: 푸시하거나 PR을 올릴 때마다 깃허브 서버에서 빌드 + 테스트를 돌린다
name: CI

on:
  push:
    branches: [ "**" ]        # 모든 브랜치
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest      # 깃허브가 빌려주는 리눅스 서버

    # 테스트가 쓸 PostgreSQL을 옆에 띄운다 (docker-compose.yml 과 같은 계정)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: usedcar
          POSTGRES_PASSWORD: usedcar
          POSTGRES_DB: usedcar_test
        ports:
          - 5433:5432
        # DB가 접속을 받을 준비가 될 때까지 기다린다 (안 기다리면 테스트가 먼저 돌아서 접속 실패)
        options: >-
          --health-cmd pg_isready 
          --health-interval 5s 
          --health-timeout 5s 
          --health-retries 10 

    env:
      # 서비스 포트를 서버(localhost)에 열었으니 localhost 로 붙는다.
      # 잡 자체를 컨테이너 안에서 돌리면 여기를 서비스 이름(postgres)으로 바꾼다
      DB_HOST: localhost

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 설정 (의존성 캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 테스트
        run: ./gradlew build

      - name: 실패하면 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test