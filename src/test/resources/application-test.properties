# 테스트: 개발용 DB와 분리된 테스트 전용 DB
# CI(깃허브 액션)에서는 환경 변수로 호스트를 바꿀 수 있게 해둔다 (11강)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5433/usedcar_test
spring.datasource.username=usedcar
spring.datasource.password=usedcar

# 테스트도 샘플 데이터를 쓴다 (1번 차량 정비 이력 등을 검사하는 테스트가 있다)
spring.flyway.locations=classpath:db/migration,classpath:db/sample

# 테스트 시작 시 DB를 비우고 다시 만들 수 있게 clean 을 허용한다 (TestDatabaseConfig 참고)
# 운영에서는 절대 켜지 않는다 → 그래서 test 프로필 파일에만 둔다
spring.flyway.clean-disabled=false