spring.application.name=usedcar

# schema.sql, data.sql 을 UTF-8로 읽는다 (윈도우에서 한글 깨짐 방지)
spring.sql.init.encoding=UTF-8

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=hello.usedcar.domain,hello.usedcar.dto
mybatis.configuration.map-underscore-to-camel-case=true

# 실행되는 SQL과 파라미터를 로그로 본다
logging.level.hello.usedcar.repository.mybatis=debug