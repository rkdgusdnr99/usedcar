spring.application.name=usedcar

# 프로필을 지정하지 않고 실행하면 local 로 뜬다 (인텔리제이에서 그냥 실행 = 로컬 개발)
spring.profiles.default=local

# Flyway: db/migration 의 V1__, V2__ ... 파일을 순서대로 한 번씩만 적용한다
spring.flyway.locations=classpath:db/migration

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=hello.usedcar.domain,hello.usedcar.dto
mybatis.configuration.map-underscore-to-camel-case=true

# 실행되는 SQL과 파라미터를 로그로 본다
logging.level.hello.usedcar.repository.mybatis=debug