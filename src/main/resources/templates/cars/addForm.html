<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>차량 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>차량 등록</h1>

<form th:action="@{/cars/add}" th:object="${car}" method="post">
    <div class="field">
        <label for="carNumber">차량번호</label>
        <input type="text" th:field="*{carNumber}" placeholder="예: 12가3456">
    </div>
    <div class="field">
        <label for="manufacturer">제조사</label>
        <input type="text" th:field="*{manufacturer}">
    </div>
    <div class="field">
        <label for="modelName">모델명</label>
        <input type="text" th:field="*{modelName}">
    </div>
    <div class="field">
        <label for="modelYear">연식</label>
        <input type="number" th:field="*{modelYear}">
    </div>
    <div class="field">
        <label for="mileage">주행거리(km)</label>
        <input type="number" th:field="*{mileage}">
    </div>
    <div class="field">
        <label for="price">가격(만원)</label>
        <input type="number" th:field="*{price}">
    </div>
    <button type="submit">등록</button>
    <a th:href="@{/cars}">취소</a>
</form>
</body>
</html>
</html>
